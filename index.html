<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <title>Clubhouse Strength Journal</title>
  <style>
    :root{--bg:#080808;--panel:#111;--panel2:#181818;--line:#2b2925;--gold:#c8a96b;--gold2:#f0d49a;--text:#f5f2eb;--muted:#99958d;--ok:#78a885;--danger:#c97a70}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#282218 0,#0b0b0b 32rem);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
    button,input{font:inherit}.shell{width:min(760px,100%);margin:auto;padding:24px 18px 110px}.eyebrow{color:var(--gold);font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.brand{font-family:Georgia,serif;font-size:clamp(2rem,9vw,3.5rem);font-weight:400;line-height:.98;margin:8px 0 10px}.subtitle,.muted{color:var(--muted);line-height:1.55}.hero{padding:32px 0 20px;border-bottom:1px solid var(--line)}
    .toolbar{display:flex;gap:10px;margin:18px 0;position:sticky;top:0;z-index:10;padding:12px 0;background:linear-gradient(#0b0b0bf2,#0b0b0bdf 75%,transparent);backdrop-filter:blur(10px)}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer}button:hover{border-color:var(--gold)}.primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#17120b;border:0;flex:1}.ghost{background:#111}.tabs{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#0c0c0cf2;border-top:1px solid var(--line);backdrop-filter:blur(14px);display:flex;justify-content:center;padding:9px max(14px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom))}.tabs button{width:min(48%,250px);border:0;background:transparent;color:var(--muted);padding:10px}.tabs button.active{color:var(--gold2)}
    .view{display:none}.view.active{display:block}.overview{padding:20px;background:linear-gradient(145deg,#1b1813,#111);border:1px solid #383025;border-radius:18px;margin:18px 0}.overview h2{font-family:Georgia,serif;font-weight:400;margin:6px 0;font-size:1.7rem}.benefits{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.pill{border:1px solid #443a2a;background:#211d17;color:#ddc38f;padding:7px 10px;border-radius:999px;font-size:.76rem}
    .section{margin:28px 0}.section-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}.section h3{font-family:Georgia,serif;font-size:1.45rem;font-weight:400;margin:0}.section-note{font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.1em}.pair{border-left:2px solid var(--gold);padding-left:11px;margin:18px 0}.pair-label{color:var(--gold);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;font-weight:800;margin-bottom:8px}
    .card{background:linear-gradient(145deg,#171717,#101010);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;transition:border-color .2s,opacity .2s}.card.completed{border-color:#35513d}.card-top{display:grid;grid-template-columns:auto 1fr auto;align-items:start;gap:12px;padding:15px}.exercise{font-weight:800;font-size:1rem}.prescription{color:var(--gold2);font-size:.8rem;margin-top:4px}.icon-btn{width:36px;height:36px;border-radius:50%;padding:0;display:grid;place-items:center}.swap{color:var(--gold2);font-size:1.05rem}.swap:active{transform:rotate(180deg)}.check{color:var(--muted);font-size:1.05rem}.check.done{background:var(--ok);color:#07110a;border-color:var(--ok)}.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:8px;padding:0 15px 14px}.set-grid label{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.set-grid input{display:block;width:100%;margin-top:5px;background:#090909;border:1px solid #333;border-radius:9px;color:var(--text);padding:10px 7px}.details{border-top:1px solid var(--line);padding:0 15px}.details summary{cursor:pointer;padding:12px 0;color:var(--gold2);font-size:.8rem;font-weight:750}.details p{color:#bbb7af;font-size:.86rem;line-height:1.55}.video{display:inline-block;color:var(--gold2);margin:0 0 14px;text-decoration:none;font-size:.82rem}
    .progress-card{padding:17px;background:var(--panel);border:1px solid var(--line);border-radius:15px;margin:10px 0}.progress-title{font-weight:800}.history-row{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:10px 0;border-top:1px solid #252525;color:var(--muted);font-size:.82rem}.empty{text-align:center;color:var(--muted);padding:55px 20px;border:1px dashed var(--line);border-radius:18px}.small{font-size:.72rem;color:var(--muted)}
    @media(max-width:480px){.shell{padding-inline:13px}.toolbar button{padding:11px 10px;font-size:.82rem}.card-top{padding:13px}.set-grid{padding-inline:13px}.overview{padding:17px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero"><div class="eyebrow">Personal training system</div><h1 class="brand">Clubhouse Strength<br>Journal</h1><div class="subtitle">A unified athletic strength plan built from your submitted programs.</div></header>
    <section id="today" class="view active">
      <div class="toolbar"><button class="primary" id="generate">Generate New Workout</button><button class="ghost" id="reset">Reset</button></div>
      <div id="workout"></div>
    </section>
    <section id="progress" class="view"><div class="section"><div class="section-head"><h3>Progress</h3><span class="section-note">Set-by-set history</span></div><div id="progressList"></div></div></section>
  </main>
  <nav class="tabs"><button class="active" data-view="today">Today's Lift</button><button data-view="progress">Progress</button></nav>
  <script>
    const e=(name,sets,reps,why,benefit,video='')=>({name,sets,reps,why,benefit,video});
    const warmupSlots={upper:[[e('Side-Plank Shoulder External Rotation',2,'10/side','Prepares the rotator cuff and teaches the shoulder blade to stay controlled.','Shoulder stability'),e('Banded External Rotation',2,'12/side','Warms the rotator cuff before pressing and pulling.','Shoulder stability'),e('TRX Pull-Apart',2,'12','Activates the upper back without tiring it.','Scapular control')],[e('Floor Slide',2,'10','Opens the upper back and improves overhead shoulder movement without heavy loading.','Scapular mobility'),e('Open Book',2,'8/side','Improves thoracic rotation so the shoulder does not compensate.','Upper-back mobility'),e('Inchworm to Upward Dog',2,'6','Warms the shoulders, trunk and upper back through a controlled range.','Total-body mobility')],[e('Medicine-Ball Chest Pass',3,'5','Builds pressing speed before strength work while keeping fatigue low.','Upper-body power'),e('Medicine-Ball Overhead Slam',3,'5','Primes fast trunk and lat engagement without heavy loading.','Upper-body power'),e('Plyometric Push-Up',3,'3–5','Prepares explosive pressing when the hands and shoulders feel comfortable.','Pressing speed')],[e('Rotational Medicine-Ball Shot-Put',3,'5/side','Connects the hips and trunk to the upper body for athletic rotational power.','Rotation and power'),e('Crow-Hop Medicine-Ball Throw',3,'4/side','Coordinates lower-body force with athletic upper-body rotation.','Total-body rotational power'),e('Half-Kneeling Medicine-Ball Scoop Toss',3,'5/side','Trains rotation from a stable hip and trunk position.','Rotational control')]],lower:[[e('Goblet Squat',2,'8','Warms the hips, knees and ankles while rehearsing the squat pattern.','Squat mobility'),e('Heel-Elevated Bodyweight Squat',2,'10','Prepares the knees and ankles for a squat-focused session.','Quad and ankle preparation'),e('Reverse Atlas Lunge',2,'6/side','Opens the hips while rehearsing single-leg control.','Hip mobility')],[e('Goblet RDL',2,'8','Prepares the hamstrings and reinforces a controlled hip hinge.','Hamstring control'),e('Banded Hamstring Curl',2,'15','Warms knee-flexion strength without heavy loading.','Hamstring preparation'),e('Knee Hug to Leg Cradle',2,'6/side','Mobilizes the hips and glutes before lower-body work.','Hip mobility')],[e('Medicine-Ball Scoop Toss',3,'5','Trains force from the ground through the hips without tiring the legs.','Hip power'),e('Reverse Medicine-Ball Scoop Toss',3,'5','Primes hip extension before squats and hinges.','Posterior-chain power'),e('Dumbbell Squat Jump',3,'3','Prepares fast force production with a light, crisp effort.','Lower-body power')],[e('Skier Hops',2,'10/side','Prepares single-leg landing control and lateral movement.','Lateral stability'),e('Lateral Skips',2,'10/side','Warms lateral rhythm and frontal-plane control.','Lateral movement'),e('Assisted Single-Leg Pogo Jump',2,'8/side','Prepares ankle stiffness and controlled elastic contacts.','Ankle reactivity')]]};
    const pools={
      upper:{title:'Upper Strength + Athletic Power',goal:'Build balanced pressing and pulling strength while protecting the shoulders and keeping rotational athleticism.',benefits:['Chest & back strength','Shoulder stability','Rotational power','Arm strength'],mains:[e('Dumbbell Bench Press',4,'8','A shoulder-friendly primary press that lets each arm find a comfortable path.','Chest, triceps and pressing strength'),e('Neutral-Grip Chin-Up',4,'AMRAP','Builds relative pulling strength and balances pressing volume.','Lats, biceps and shoulder health'),e('Incline Dumbbell Bench Press',4,'8–10','Trains upper-chest strength with a shoulder-friendly grip and range.','Upper chest and triceps')],pairs:[[e('Chest-Supported Dumbbell Row',3,'10','Adds back strength without loading the lower back.','Upper back and posture'),e('Half-Kneeling Landmine Press',3,'10/side','Trains pressing with core control and less overhead shoulder stress.','Shoulders, serratus and core')],[e('Face Pull',3,'12–15','Balances pressing with rear-shoulder and shoulder-blade work.','Rear delts and shoulder health'),e('Pallof Press — Athletic Stance',3,'10/side','Resists unwanted rotation and improves force transfer.','Anti-rotation core stability')],[e('Incline Dumbbell Curl',3,'10–12','Strengthens the biceps through a long range.','Biceps'),e('Dumbbell Overhead Triceps Extension',3,'10–12','Adds direct triceps work after the main pressing.','Triceps')]]},
      lower:{title:'Lower Strength + Speed',goal:'Develop squat and hinge strength, single-leg control, hamstring durability and lower-body power.',benefits:['Leg strength','Hamstring durability','Single-leg control','Speed & power'],mains:[e('Front Squat',4,'6–8','Keeps the torso upright while building strong quads and a powerful squat pattern.','Quads, core and total leg strength'),e('Trap-Bar Deadlift',4,'5','Builds total lower-body force with a more upright, back-friendly position.','Glutes, hamstrings and total strength'),e('Back Squat',5,'3','Develops high-force lower-body strength with full recovery between sets.','Total leg strength')],pairs:[[e('Bulgarian Split Squat',3,'8/side','Builds single-leg strength and exposes side-to-side differences.','Quads, glutes and balance'),e('Single-Leg RDL',3,'8/side','Strengthens the hamstrings while training hip and foot control.','Hamstrings, glutes and balance')],[e('Lateral Lunge',3,'10/side','Adds frontal-plane strength missing from most traditional lifting.','Groin, glutes and lateral movement'),e('Stability-Ball Hamstring Curl',3,'12','Builds knee-flexion hamstring strength without heavy spinal loading.','Hamstrings and knee control')],[e('Standing Calf Raise',3,'AMRAP','Strengthens the lower leg for running, jumping and ankle resilience.','Calves and ankles'),e('Barbell Ab Rollout',3,'8–12','Teaches the trunk to resist extension under a long lever.','Anterior core')]]}}
    const swapSlots={upper:{p00:[e('Chest-Supported Dumbbell Row',3,'10','Adds back strength without loading the lower back.','Upper back and posture'),e('One-Arm Dumbbell Row',3,'10/side','Builds unilateral back strength and lets the shoulder blade move naturally.','Lats and upper back'),e('Supinated Cable Row',3,'10','Adds a shoulder-friendly horizontal pull with biceps involvement.','Back and biceps')],p01:[e('Half-Kneeling Landmine Press',3,'10/side','Trains pressing with core control and less overhead shoulder stress.','Shoulders, serratus and core'),e('Single-Arm Dumbbell Floor Press',3,'10/side','Builds pressing strength with a shoulder-friendly range.','Chest, triceps and core'),e('Single-Arm Dumbbell Shoulder Press',3,'8/side','Trains overhead strength through a pain-free neutral grip.','Shoulders and core')],p10:[e('Face Pull',3,'12–15','Balances pressing with rear-shoulder and shoulder-blade work.','Rear delts and shoulder health'),e('Reverse Fly',3,'12','Strengthens the rear delts and upper back after pressing.','Rear shoulders and posture'),e('TRX Pull-Apart',3,'12','Trains shoulder-blade control with adjustable resistance.','Upper back and shoulder health')],p11:[e('Pallof Press — Athletic Stance',3,'10/side','Resists unwanted rotation and improves force transfer.','Anti-rotation core stability'),e('Cable Hold',3,'20 sec/side','Builds anti-rotation strength without repeated spinal motion.','Core stability'),e('Dead Bug with Overhead Band',3,'8/side','Connects rib position and core control to shoulder movement.','Anterior core control')],p20:[e('Incline Dumbbell Curl',3,'10–12','Strengthens the biceps through a long range.','Biceps'),e('Hammer Curl',3,'10–12','Builds the biceps and forearms with a neutral grip.','Biceps and forearms'),e('Barbell Curl',3,'10','Adds bilateral arm strength with controlled form.','Biceps')],p21:[e('Dumbbell Overhead Triceps Extension',3,'10–12','Adds direct triceps work after the main pressing.','Triceps'),e('Cable Triceps Pressdown',3,'12–15','Trains the triceps with stable, joint-friendly resistance.','Triceps'),e('Skull Crusher',3,'10','Builds elbow-extension strength through a long range.','Triceps')]},lower:{p00:[e('Bulgarian Split Squat',3,'8/side','Builds single-leg strength and exposes side-to-side differences.','Quads, glutes and balance'),e('Single-Leg Box Squat',3,'10/side','Develops controlled single-leg squat strength.','Quads, glutes and balance'),e('Barbell Step-Up',3,'8/side','Builds single-leg force through a stable range.','Quads and glutes')],p01:[e('Single-Leg RDL',3,'8/side','Strengthens the hamstrings while training hip and foot control.','Hamstrings, glutes and balance'),e('Landmine RDL',3,'10','Trains the hinge with a guided and stable loading path.','Hamstrings and glutes'),e('Stability-Ball Hamstring Curl',3,'12','Builds knee-flexion hamstring strength without heavy spinal loading.','Hamstrings and knee control')],p10:[e('Lateral Lunge',3,'10/side','Adds frontal-plane strength missing from most traditional lifting.','Groin, glutes and lateral movement'),e('Landmine Lateral Lunge',3,'8/side','Adds guided load to lateral hip and groin strength.','Groin and glutes'),e('Walking Lunge',3,'10/side','Builds single-leg strength through continuous forward movement.','Quads and glutes')],p11:[e('Stability-Ball Hamstring Curl',3,'12','Builds knee-flexion hamstring strength without heavy spinal loading.','Hamstrings and knee control'),e('Banded Hamstring Curl',3,'15–20','Adds hamstring volume with low joint and spinal stress.','Hamstring durability'),e('Glute-Ham Raise',3,'8–10','Builds strong hamstrings across the knee and hip.','Hamstrings and glutes')],p20:[e('Standing Calf Raise',3,'AMRAP','Strengthens the lower leg for running, jumping and ankle resilience.','Calves and ankles'),e('Single-Leg Calf Raise',3,'12/side','Builds side-to-side ankle and calf strength.','Calves and ankle control'),e('Farmer Carry',3,'30 yd','Trains posture, grip and lower-leg stiffness while walking.','Grip, trunk and gait')],p21:[e('Barbell Ab Rollout',3,'8–12','Teaches the trunk to resist extension under a long lever.','Anterior core'),e('Bench Leg Raise',3,'AMRAP','Builds lower-ab control without loading the spine.','Anterior core'),e('Dragon Flag',3,'5–8','Challenges full-body anti-extension strength with strict control.','Advanced core strength')]}};
    let workout=null;const storeKey='clubhouseStrengthHistoryV1';const todayKey='clubhouseStrengthTodayV1';
    const loadHistory=()=>JSON.parse(localStorage.getItem(storeKey)||'[]');const saveHistory=h=>localStorage.setItem(storeKey,JSON.stringify(h));
    function choose(a){return a[Math.floor(Math.random()*a.length)]}function makeWorkout(){const type=(!workout||workout.type==='lower')?'upper':'lower',p=pools[type];workout={id:Date.now(),type,title:p.title,goal:p.goal,benefits:p.benefits,warmup:warmupSlots[type].map(choose),main:choose(p.mains),pairs:[[choose(swapSlots[type].p00),choose(swapSlots[type].p01)],[choose(swapSlots[type].p10),choose(swapSlots[type].p11)],[choose(swapSlots[type].p20),choose(swapSlots[type].p21)]],values:{},done:{},logged:{}};saveWorkout();renderWorkout()}
    function saveWorkout(){localStorage.setItem(todayKey,JSON.stringify(workout))}
    function card(x,key,isWarm=false){const fields=Array.from({length:x.sets},(_,i)=>`<label>Set ${i+1}<input inputmode="decimal" placeholder="lb" value="${workout.values[key]?.[i]||''}" data-key="${key}" data-set="${i}"></label>`).join('');const search=x.video||`https://www.youtube.com/results?search_query=${encodeURIComponent('Cressey Sports Performance '+x.name)}`;return `<article class="card ${workout.done[key]?'completed':''}"><div class="card-top"><button class="icon-btn swap" data-swap="${key}" aria-label="Swap ${x.name} for a similar exercise" title="Swap exercise">↻</button><div><div class="exercise">${x.name}</div><div class="prescription">${x.sets} sets × ${x.reps}</div></div><button class="icon-btn check ${workout.done[key]?'done':''}" data-complete="${key}" aria-label="${workout.done[key]?'Mark incomplete':'Mark complete'}">${workout.done[key]?'✓':'○'}</button></div>${isWarm?'':`<div class="set-grid">${fields}</div>`}<details class="details"><summary>Why this exercise?</summary><p><strong>Why today:</strong> ${x.why}</p><p><strong>Benefit:</strong> ${x.benefit}</p><a class="video" href="${search}" target="_blank" rel="noopener">View demonstration ↗</a></details></article>`}
    function renderWorkout(){if(!workout){makeWorkout();return}const root=document.querySelector('#workout');root.innerHTML=`<section class="overview"><div class="eyebrow">Today's training goal</div><h2>${workout.title}</h2><p class="muted">${workout.goal}</p><div class="benefits">${workout.benefits.map(x=>`<span class="pill">${x}</span>`).join('')}</div></section><section class="section"><div class="section-head"><h3>Full Warm-Up</h3><span class="section-note">Prepare · don't fatigue</span></div>${workout.warmup.map((x,i)=>card(x,'w'+i,true)).join('')}</section><section class="section"><div class="section-head"><h3>Main Lift</h3><span class="section-note">Full recovery</span></div>${card(workout.main,'main')}</section><section class="section"><div class="section-head"><h3>Strength Work</h3><span class="section-note">3 supersets</span></div>${workout.pairs.map((pair,i)=>`<div class="pair"><div class="pair-label">Superset ${String.fromCharCode(65+i)} · alternate exercises</div>${pair.map((x,j)=>card(x,'p'+i+j)).join('')}</div>`).join('')}</section>`;bindWorkout()}
    function allExercises(){return [...workout.warmup.map((x,i)=>[x,'w'+i]),[workout.main,'main'],...workout.pairs.flatMap((p,i)=>p.map((x,j)=>[x,'p'+i+j]))]}
    function alternativesFor(key){if(key==='main')return pools[workout.type].mains;if(key[0]==='w')return warmupSlots[workout.type][+key.slice(1)];return swapSlots[workout.type][key]||[]}
    function replaceExercise(key,next){if(key==='main')workout.main=next;else if(key[0]==='w')workout.warmup[+key.slice(1)]=next;else{const m=key.match(/^p(\d)(\d)$/);if(m)workout.pairs[+m[1]][+m[2]]=next}}
    function bindWorkout(){document.querySelectorAll('input[data-key]').forEach(inp=>inp.oninput=()=>{const k=inp.dataset.key,i=+inp.dataset.set;workout.values[k]??=[];workout.values[k][i]=inp.value;saveWorkout()});document.querySelectorAll('[data-swap]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.swap,item=allExercises().find(([,key])=>key===k),options=alternativesFor(k).filter(x=>x.name!==item?.[0].name);if(!options.length)return;replaceExercise(k,choose(options));delete workout.values[k];delete workout.done[k];workout.logged??={};delete workout.logged[k];saveWorkout();renderWorkout()});document.querySelectorAll('[data-complete]').forEach(btn=>btn.onclick=()=>{const k=btn.dataset.complete;workout.done[k]=!workout.done[k];workout.logged??={};const item=allExercises().find(([,key])=>key===k);if(workout.done[k]&&!workout.logged[k]&&item&&workout.values[k]?.some(Boolean)){const h=loadHistory();h.push({date:new Date().toISOString(),workout:workout.title,exercise:item[0].name,sets:[...workout.values[k]]});saveHistory(h);workout.logged[k]=true}saveWorkout();renderWorkout()})}
    function renderProgress(){const h=loadHistory(),root=document.querySelector('#progressList');if(!h.length){root.innerHTML='<div class="empty">Complete an exercise with set weights entered to begin your progress history.</div>';return}const groups={};h.slice().reverse().forEach(x=>(groups[x.exercise]??=[]).push(x));root.innerHTML=Object.entries(groups).map(([name,rows])=>`<div class="progress-card"><div class="progress-title">${name}</div><p class="small">${rows.length} logged session${rows.length===1?'':'s'}</p>${rows.slice(0,8).map(r=>`<div class="history-row"><span>${new Date(r.date).toLocaleDateString()}</span><span>${r.sets.map((v,i)=>`S${i+1}: ${v||'—'} lb`).join(' · ')}</span></div>`).join('')}</div>`).join('')}
    document.querySelector('#generate').onclick=makeWorkout;document.querySelector('#reset').onclick=()=>{if(confirm('Clear today’s entries and completion marks?')){workout.values={};workout.done={};workout.logged={};saveWorkout();renderWorkout()}};
    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='progress')renderProgress();scrollTo({top:0,behavior:'smooth'})});
    try{workout=JSON.parse(localStorage.getItem(todayKey))}catch{}renderWorkout();
  </script>
</body>
</html>
